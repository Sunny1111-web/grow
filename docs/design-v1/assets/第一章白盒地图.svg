<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
<defs>
  <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse" patternTransform="translate(100 210)"><path d="M48 0H0V48" fill="none" stroke="#cdd5d5" stroke-width="1"/></pattern>
  <pattern id="soil" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M3 18l5-4m7-8l4-3" stroke="#bbc6c3" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#3c7458" stroke-width="2"/></marker>
  <marker id="waterarrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#318598" stroke-width="2"/></marker>
  <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#243b3f} .small{font-size:17px}.label{font-size:19px;font-weight:600}.caption{font-size:18px;fill:#556b6e}.point{fill:#fff;stroke:#3c7458;stroke-width:3}.call{stroke:#6b7d7f;stroke-width:1.3;fill:none}</style>
</defs>
<rect width="1600" height="1080" fill="#f5f3eb"/>
<text x="70" y="72" font-size="17" letter-spacing="4" fill="#638171">GROW / DESIGN DOCUMENTATION</text>
