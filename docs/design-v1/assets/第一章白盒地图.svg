<text x="256" y="742" class="small">R0 固定应急子叶</text>
<g fill="#f5f3eb" stroke="#318598" stroke-width="2"><circle cx="272.8" cy="805.2" r="5"/><circle cx="349.6" cy="810" r="5"/><circle cx="426.4" cy="814.8" r="5"/></g>
<text x="272" y="778" class="small">C1 → C2 → C3 湿润线索</text>
<!-- Nodes and small icons -->
<g class="point"><circle cx="196" cy="690" r="7"/><circle cx="263" cy="635" r="7"/><circle cx="370" cy="619" r="7"/><circle cx="453" cy="615" r="7"/><circle cx="535" cy="522" r="7"/><circle cx="700" cy="505" r="7"/><circle cx="700" cy="403" r="7"/><circle cx="864" cy="391" r="7"/></g>
