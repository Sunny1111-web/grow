<!-- Labels -->
<text x="113" y="760" class="label">S0 种子</text>
<text x="129" y="850" class="label">W1 12 W</text>
<text x="429" y="857" class="label">W2 总20 W</text>
<text x="646" y="817" class="small">同一含水层，供水不可相加</text>
<text x="112" y="655" class="small">F0 裂缝</text>
<text x="285" y="550" class="label">L1 普通光</text>
<path d="M323 557L300 574" class="call"/>
<text x="283" y="677" class="small">S1 椅子</text>
<text x="484" y="560" class="label">S2 书桌</text>
<text x="509" y="444" class="label">L2 强光</text>
<text x="466" y="607" class="small">低位可选路线</text>
<text x="546" y="678" class="small">M1 水壶记忆</text>
<text x="723" y="544" class="label">S3 管道</text>
<text x="897" y="459" class="label">S4 窗框</text>
<text x="894" y="335" class="label">G 出口</text>
<text x="107" y="232" class="small">y=10</text><text x="107" y="875" class="small">y=-4</text>
<text x="99" y="911" class="small">x=0</text><text x="1221" y="911" class="small">24u</text>
<!-- Right note column -->
<text x="1300" y="237" font-size="23" font-weight="700">图例与验收</text>
<path d="M1300 280h38" stroke="#3c7458" stroke-width="5"/><text x="1350" y="286" class="small">推荐地上路线</text>
<path d="M1300 324h38" stroke="#318598" stroke-width="3" stroke-dasharray="7 4"/><text x="1350" y="330" class="small">地下扩展路线</text>
<circle cx="1318" cy="370" r="7" class="point"/><text x="1350" y="376" class="small">可攀附支点</text>
<rect x="1303" y="405" width="30" height="18" fill="#edc14c" opacity=".6"/><text x="1350" y="422" class="small">固定光照区域</text>
<path d="M1300 460h38" stroke="#b87460" stroke-width="2.5" stroke-dasharray="6 4"/><text x="1350" y="466" class="small">高风险直达方向</text>
<text x="1300" y="532" class="label">首叶路线预算</text>
<text x="1300" y="570" class="small">2根 × 4 = 8 E</text>
<text x="1300" y="601" class="small">3藤 × 5 = 15 E</text>
<text x="1300" y="632" class="small">1叶 × 3 = 3 E</text>
<text x="1300" y="674" font-size="22" font-weight="700">30 − 26 = 4 E</text>
<text x="1300" y="726" class="small">绿色曲线表达路线意图，</text>
<text x="1300" y="754" class="small">并非每段的最终几何。</text>
<text x="1300" y="798" class="small">白盒须实测固定段长、</text>
<text x="1300" y="826" class="small">碰撞、向性、支撑与水。</text>
<text x="1300" y="854" class="small">通过后才能锁定坐标。</text>
<text x="100" y="973" font-size="22" font-weight="600">体验顺序：接水 → 破土 → 第一片叶 → 扩张与支撑 → 水压力与修剪 → 窗外</text>
<text x="100" y="1014" class="caption">静态白盒规范 v1.0　｜　2026年9月5日　｜　共生幼苗属于P1，未计入本图与P0关卡承诺</text>
</svg>
